version: '3.8'

services:
  cortex-analytics-engine:
    build: .
    image: cortex-analytics-engine:v3
    container_name: cortex-analytics-engine-v3
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=deepseek-v3.1:671b-cloud
    volumes:
      - ./logs:/app/logs
      - ./:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    command: ["data/sales.csv"]
